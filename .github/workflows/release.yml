name: release

# Runs on every push to main and does one of two things: cuts the release the
# release pull request just brought in, or refreshes that pull request. Nothing
# waits on a tag push, so there is no cross-workflow handoff to lose.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Everything runs as the app rather than as GITHUB_TOKEN, so its pushes
      # raise real events and the pull request it opens is not held for approval.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrow the token to what this job needs, so a permission the app
          # gains for another repository is not inherited here. Workflows is
          # required because building the release branch writes
          # .github/workflows/* onto a branch that did not have them.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      # This job pushes tags and the release branch, so the checkout
      # credentials are the point here rather than an oversight.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: uv git-cliff
          cache: false
      - run: mise run release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_SLUG: ${{ steps.app-token.outputs.app-slug }}
