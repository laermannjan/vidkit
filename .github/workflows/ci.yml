name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          # ffmpeg is in mise.toml for local work. Nothing CI runs needs it:
          # mkvmerge sits behind a seam so tests can inject a fake, and steps 1
          # and 2 of the build order touch no external binary at all.
          install_args: uv ruff ty
      - run: mise run check
