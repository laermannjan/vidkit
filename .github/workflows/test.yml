name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: ruff
      - run: mise run lint

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: ruff
      - run: mise run format

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: uv ty
      - run: mise run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: uv
      - run: mise run test

  # The only required check. A required check that is skipped counts as passed,
  # so this asserts each result rather than relying on `needs` alone, and runs
  # even when a dependency failed. Adding or splitting a job above needs no
  # change to branch protection.
  gate:
    needs: [lint, format, typecheck, test]
    # always(), not `always() && !cancelled()`: the latter skips this job when a
    # run is cancelled, and a skipped required check counts as passed. Running it
    # costs one short job and turns a cancellation into a visible failure.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          [[ "${{ needs.lint.result }}"      == success ]] || exit 1
          [[ "${{ needs.format.result }}"    == success ]] || exit 1
          [[ "${{ needs.typecheck.result }}" == success ]] || exit 1
          [[ "${{ needs.test.result }}"      == success ]] || exit 1
