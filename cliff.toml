# git-cliff. CHANGELOG.md is generated from conventional commit subjects and is
# never hand-edited; the release workflow regenerates it in full every time.
[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]($REPO/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**({{ commit.scope }})** {% endif %}\
{% if commit.breaking %}**breaking** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim }} in \
{% if commit.remote.pr_number %}[#{{ commit.remote.pr_number }}]($REPO/pull/{{ commit.remote.pr_number }})\
{% else %}[{{ commit.id | truncate(length=7, end="") }}]($REPO/commit/{{ commit.id }})\
{% endif %}\
{% endfor %}
{% endfor %}\n
"""
footer = "<!-- generated by git-cliff -->\n"
trim = true
postprocessors = [{ pattern = '\$REPO', replace = "https://github.com/laermannjan/vidkit" }]

[git]
conventional_commits = true
# Keep everything. A type that is not user-facing still belongs in the record,
# under Chore, so the history is complete rather than flattering.
filter_unconventional = false
filter_commits = false
split_commits = false
commit_preprocessors = [{ pattern = '(?m)\s*\(#([0-9]+)\)$', replace = "" }]
# Order matters: the release commits are skipped before the generic chore
# rule can group them. Types and sections are documented in AGENTS.md; the two
# lists must agree.
commit_parsers = [
  { message = "^chore: release", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 01 -->🚀 Features" },
  { message = "^fix", group = "<!-- 02 -->🐛 Bug fixes" },
  { message = "^perf", group = "<!-- 03 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 04 -->🚜 Refactor" },
  { message = "^docs", group = "<!-- 05 -->📚 Documentation" },
  { message = "^test", group = "<!-- 06 -->🧪 Testing" },
  { message = "^[Rr]evert", group = "<!-- 07 -->◀️ Revert" },
  { message = ".*", group = "<!-- 08 -->⚙️ Chore" },
]
tag_pattern = "v[0-9]*"
sort_commits = "oldest"

[remote.github]
owner = "laermannjan"
repo = "vidkit"
