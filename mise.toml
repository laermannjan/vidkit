# Tools this repo is developed with. None of them is a runtime requirement:
# `vidkit doctor` names what is missing and how to install it, and never assumes
# mise is present. See SPEC.md, External tools.
#
# The split: uv owns Python and Python dependencies, so the interpreter is
# pinned once in .python-version and not repeated here. mise owns everything
# that is not a Python package.
[tools]
uv = "latest"
ruff = "latest"
ty = "latest"
ffmpeg = "latest"
git-cliff = "latest"
shellcheck = "latest"
shfmt = "latest"
actionlint = "latest"
zizmor = "latest"

[tasks.fmt]
description = "Format"
run = "ruff format ."

[tasks.lint]
description = "Lint and check formatting"
run = ["ruff check .", "ruff format --check ."]

[tasks.sync]
description = "Install Python dependencies into .venv"
run = "uv sync"

[tasks.typecheck]
description = "Type check"
# ty resolves imports through .venv, so it needs one to exist. Locally this
# passes without the dependency because a venv is lying around; in CI it does
# not. Depend on it explicitly rather than on leftover state.
depends = ["sync"]
run = "ty check"

[tasks.test]
description = "Run the test suite"
depends = ["sync"]
run = "uv run pytest"

[tasks.check]
description = "Everything CI runs"
depends = ["lint", "typecheck", "test"]

[tasks.release-prep]
description = "Compute the next CalVer, regenerate the changelog, refresh the release PR"
run = "./xtasks/release-prep"
