[project]
name = "vidkit"
version = "2026.9.1"
description = "Capture video stream URLs, download them, merge multi-language audio, tag and file them into a media library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
vidkit = "vidkit.cli:main"

[project.urls]
Repository = "https://github.com/laermannjan/vidkit"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# prototype/ is a reference implementation, kept deliberately close to the thing
# it proves and ported in build step 7. It declares its own inline dependencies
# and is not part of the package. See README.md.
exclude = ["prototype"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
exclude = ["prototype"]

[tool.pytest.ini_options]
testpaths = ["tests"]
